// so fit/default framing use the best-fitting free rectangle without changing node physics.
function graphSafeViewport(){
 const rect=svg.getBoundingClientRect(),title=document.querySelector('.title')?.getBoundingClientRect();
 const base={x:24,y:Math.max(24,(title?.bottom||0)-rect.top+20),right:rect.width-24,bottom:rect.height-76};
 base.right=Math.max(base.x+80,base.right);base.bottom=Math.max(base.y+80,base.bottom);
 let candidates=[base];
 try{
  const panel=parent.document.getElementById('detail-panel'),frameRect=frameElement.getBoundingClientRect();
  if(panel&&!panel.hidden){
   const p=panel.getBoundingClientRect(),left=p.left-frameRect.left-18,right=p.right-frameRect.left+18,top=p.top-frameRect.top-18,bottom=p.bottom-frameRect.top+18;
   if(right>base.x&&left<base.right&&bottom>base.y&&top<base.bottom){
    candidates=[{...base,right:Math.min(base.right,left)},{...base,x:Math.max(base.x,right)},{...base,bottom:Math.min(base.bottom,top)},{...base,y:Math.max(base.y,bottom)}].filter(r=>r.right-r.x>=160&&r.bottom-r.y>=120);
   }
  }
 }catch(error){/* Standalone HTML still frames within its own canvas. */}
 const visible=visibleGraphNodes();
 const spanX=Math.max(1,...visible.map(n=>n.x+n.layoutBox.right))-Math.min(0,...visible.map(n=>n.x+n.layoutBox.left));
 const spanY=Math.max(1,...visible.map(n=>n.y+n.layoutBox.bottom))-Math.min(0,...visible.map(n=>n.y+n.layoutBox.top));
 const fit=r=>Math.min((r.right-r.x)/Math.max(1,spanX),(r.bottom-r.y)/Math.max(1,spanY));
 const free=candidates.sort((a,b)=>fit(b)-fit(a)||(b.right-b.x)*(b.bottom-b.y)-(a.right-a.x)*(a.bottom-a.y))[0]||base;
 return {...free,width:free.right-free.x,height:free.bottom-free.y};
}
function frameGraph(percent=null){
 const nodes=visibleGraphNodes();if(!nodes.length)return;
 const rect=svg.getBoundingClientRect();if(!rect.width||!rect.height)return;
 const free=graphSafeViewport();
 // Re-evaluate label geometry if fitting crosses a label-detail threshold.
 for(let pass=0;pass<3;pass++){
  updateNodeLabels();
  const left=Math.min(...nodes.map(n=>n.x+n.layoutBox.left)),right=Math.max(...nodes.map(n=>n.x+n.layoutBox.right));
  const top=Math.min(...nodes.map(n=>n.y+n.layoutBox.top)),bottom=Math.max(...nodes.map(n=>n.y+n.layoutBox.bottom));
  const scale=percent===null?Math.min(4,free.width/Math.max(1,right-left),free.height/Math.max(1,bottom-top)):percent/100;
  const cameraY=percent!==null&&(bottom-top)*scale>free.height?top-free.y/scale:(top+bottom)/2-(free.y+free.height/2)/scale;
  vb=[(left+right)/2-(free.x+free.width/2)/scale,cameraY,rect.width/scale,rect.height/scale];
  svg.setAttribute('viewBox',vb.join(' '));
 }
 updateNodeLabels();reportGraphZoom();
}
function readGraphZoom(){const m=svg.getScreenCTM();return m?Math.hypot(m.a,m.b)*100:100;}
function reportGraphZoom(){parent.postMessage({action:'zoom-state',percent:readGraphZoom()},'*');}
function setGraphZoom(percent,clientX,clientY){
 if(!Number.isFinite(percent))return;
 percent=Math.max(10,Math.min(400,percent));
 const rect=svg.getBoundingClientRect(),matrix=svg.getScreenCTM();if(!matrix||!rect.width||!rect.height)return;
 const px=clientX??rect.left+rect.width/2,py=clientY??rect.top+rect.height/2;
 const point=svg.createSVGPoint();point.x=px;point.y=py;const anchor=point.matrixTransform(matrix.inverse());
 const width=rect.width/(percent/100),height=rect.height/(percent/100);
 const box=[anchor.x-(px-rect.left)/rect.width*width,anchor.y-(py-rect.top)/rect.height*height,width,height];
 vb=box;
 svg.setAttribute('viewBox',box.join(' '));reportGraphZoom();
}
window.readGraphZoom=readGraphZoom;window.setGraphZoom=setGraphZoom;
svg.addEventListener('wheel',event=>{event.preventDefault();setGraphZoom(readGraphZoom()*(event.deltaY>0?1/1.12:1.12),event.clientX,event.clientY);},{passive:false});
new MutationObserver(reportGraphZoom).observe(svg,{attributes:true,attributeFilter:['viewBox']});
if(!(saved?.box&&saved.layoutVersion===data.semantic?.layout?.method))frameGraph(50);
window.addEventListener('resize',reportGraphZoom);reportGraphZoom();

window.readGraphControls=()=>({running,isolated:isolatedOption.checked,edges:Object.fromEntries([...document.querySelectorAll('[data-type]')].map(input=>[input.dataset.type,input.checked]))});
function reportGraphControls(){parent.postMessage({action:'controls-state'},'*');}
window.runGraphAction=(action,value)=>{
 if(action==='isolated'){isolatedOption.checked=!!value;isolatedOption.dispatchEvent(new Event('change'));}
 else if(action.startsWith('edge:')){const input=document.querySelector('[data-type="'+action.slice(5)+'"]');if(input){input.checked=!!value;input.dispatchEvent(new Event('change'));}}
 else{const id={motion:'motion',fit:'fit',reset:'reset',pdf:'pdf'}[action];if(id)document.getElementById(id).click();}
 reportGraphControls();
};
document.addEventListener('change',reportGraphControls);document.getElementById('motion').addEventListener('click',reportGraphControls);reportGraphControls();
</script></html>
