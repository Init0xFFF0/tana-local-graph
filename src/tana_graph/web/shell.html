<main><div id="zoom-controls" role="group" aria-label="图谱缩放"><button id="zoom-out" type="button" aria-label="缩小" title="缩小">−</button><label><input id="zoom-percent" type="text" inputmode="decimal" aria-label="缩放比例，百分比" title="输入 10–400，按回车应用" autocomplete="off" value="100%"></label><button id="zoom-in" type="button" aria-label="放大" title="放大">+</button></div><iframe id="view" title="交互式 Tana 知识图谱"></iframe><section id="detail-panel" class="compact" aria-label="图谱详情面板"><div id="panel-handle" title="拖动移动详情面板"><span class="panel-grip" aria-hidden="true">⠿</span><strong>图谱详情</strong><button id="panel-minimize" type="button" aria-label="收起详情面板" aria-controls="detail-panel" aria-expanded="true" title="隐藏详情面板"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16m-7-8h5m-3-3 3 3-3 3"/></svg></button></div><aside><div class="search-tools"><input id="node-search" type="search" aria-label="搜索节点" placeholder="搜索标题、正文或 #Supertag…" title="例如 #Note 梯度；直接输入关键词也可搜索" autocomplete="off"><div class="search-actions"><span>点击节点查看 · 点击空白处关闭</span></div><div id="search-results" class="search-results" aria-live="polite"></div></div><div id="overview"><span class="eyebrow">探索笔记</span><h2 class="overview-title">从一个节点开始</h2><p id="summary" class="overview-summary"></p><p class="overview-help">点击节点，阅读内容和语义相关笔记。</p></div><div id="detail" hidden></div></aside><footer class="panel-footer"><details id="view-options"><summary>视图选项<span>⌄</span></summary><div class="view-option-actions"><button id="ui-fit" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>适应窗口</button><button id="ui-reset" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg>重置布局</button></div><div class="edge-options"><label><input type="checkbox" data-ui-edge="ref" checked>正文引用</label><label><input type="checkbox" data-ui-edge="topic" checked>Topic 归属</label><label><input type="checkbox" data-ui-edge="parent" checked>Topic 父级</label><label><input type="checkbox" data-ui-edge="contains" checked>父子层级</label></div></details><div class="graph-actions"><label id="isolation-control" class="toggle-control"><input id="ui-isolated" type="checkbox" checked><span class="toggle-track" aria-hidden="true"></span><span>孤立节点</span></label><div class="action-buttons"><button id="ui-motion" type="button" aria-label="暂停动态"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14M16 5v14"/></svg><span>暂停</span></button><button id="ui-pdf" type="button" title="导出 PDF"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg><span>PDF</span></button></div></div></footer></section></main><script>
let views=@@VIEWS@@;
let graphData=@@GRAPH@@, schemaData=@@SCHEMA@@;

// A modeless, draggable detail panel. Collapse keeps the same DOM and reading position.
const detailPanel=document.getElementById('detail-panel'),panelHandle=document.getElementById('panel-handle'),panelMinimize=document.getElementById('panel-minimize'),panelReveal=document.getElementById('show-detail-panel');
let collapsedDetailScroll=0;
function setDetailPanelOpen(open,focus=false){
 const wasHidden=detailPanel.hidden,aside=document.querySelector('aside');
 if(!open&&!wasHidden)collapsedDetailScroll=aside.scrollTop;
 detailPanel.hidden=!open;
 if(open&&wasHidden)aside.scrollTop=collapsedDetailScroll;panelReveal.hidden=open;
 panelMinimize.setAttribute('aria-expanded',String(open));panelReveal.setAttribute('aria-expanded',String(open));
 if(open)clampDetailPanel();
 if(focus)(open?panelMinimize:panelReveal).focus({preventScroll:true});
}
function clampDetailPanel(){
 const header=document.querySelector('header').getBoundingClientRect();document.documentElement.style.setProperty('--graph-header-height',header.bottom+'px');
 if(detailPanel.hidden)return;
 const box=detailPanel.getBoundingClientRect(),minY=header.bottom+12,maxX=Math.max(12,innerWidth-box.width-12),maxY=Math.max(minY,innerHeight-box.height-12);
 const x=Math.min(maxX,Math.max(12,box.left)),y=Math.min(maxY,Math.max(minY,box.top));
 if(detailPanel.style.left||x!==box.left||y!==box.top){detailPanel.style.right='auto';detailPanel.style.left=x+'px';detailPanel.style.top=y+'px';}
}
function detailReadingScroll(){return detailPanel.hidden?collapsedDetailScroll:document.querySelector('aside').scrollTop;}
function restoreDetailReadingScroll(value){collapsedDetailScroll=value;if(!detailPanel.hidden)document.querySelector('aside').scrollTop=value;}
panelMinimize.onclick=()=>setDetailPanelOpen(false,true);
panelReveal.onclick=()=>setDetailPanelOpen(true,true);
let panelDrag=null;
panelHandle.addEventListener('pointerdown',e=>{
 if(e.button!==0||e.target.closest('button'))return;
 e.preventDefault();const box=detailPanel.getBoundingClientRect();panelDrag={pointerId:e.pointerId,dx:e.clientX-box.left,dy:e.clientY-box.top};panelHandle.setPointerCapture(e.pointerId);detailPanel.classList.add('dragging');
});
panelHandle.addEventListener('pointermove',e=>{
 if(!panelDrag||e.pointerId!==panelDrag.pointerId)return;
 detailPanel.style.right='auto';detailPanel.style.left=(e.clientX-panelDrag.dx)+'px';detailPanel.style.top=(e.clientY-panelDrag.dy)+'px';clampDetailPanel();
});
function endPanelDrag(){panelDrag=null;detailPanel.classList.remove('dragging');}
for(const type of ['pointerup','pointercancel','lostpointercapture'])panelHandle.addEventListener(type,endPanelDrag);
window.addEventListener('resize',clampDetailPanel);
new ResizeObserver(clampDetailPanel).observe(document.querySelector('header'));
new ResizeObserver(clampDetailPanel).observe(detailPanel);
clampDetailPanel();

const frame=document.getElementById('view'), nodeIndex=new Map(graphData.nodes.map(n=>[n.id,n]));let currentView='content',history=[],activeId=null;
let lastObservedAt=null;
function refreshLiveTime(){
 const el=document.getElementById('sync-time');if(!lastObservedAt){el.textContent='';return;}
 const date=new Date(lastObservedAt);if(!Number.isFinite(date.getTime())){el.textContent='';return;}
 const age=Math.max(0,Math.floor((Date.now()-date.getTime())/1000));el.textContent=age<5?'刚刚更新':age<60?age+' 秒前更新':Math.floor(age/60)+' 分钟前更新';el.title='最近成功同步 '+date.toLocaleString();
}
function setLiveStatus(state,observedAt){
 const el=document.getElementById('live-status');el.dataset.state=state;
 document.getElementById('sync-label').textContent={refreshing:'正在同步',ready:'自动同步',offline:'连接中断'}[state]||'正在连接';
 if(observedAt)lastObservedAt=observedAt;refreshLiveTime();el.title=state==='offline'?'暂时无法同步，保留最近数据':'自动检查 Tana 笔记变化';
}
setInterval(refreshLiveTime,1000);
function focusNode(id,center=false){frame.contentWindow.postMessage({action:'focus',id,center},'*');}
function overview(){detailPanel.classList.add('compact');clampDetailPanel();history=[];activeId=null;document.getElementById('detail').hidden=true;document.getElementById('overview').hidden=false;focusNode(null);}
const byId=new Map([...schemaData.tags,...schemaData.fields].map(n=>[n.id,n]));
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!=null)el.textContent=text;return el;}
function inline(parent,text){
 const pattern=/\[([^\]]+)\]\(tana:([^)]*)\)|<code>(.*?)<\/code>|`([^`]+)`|\*\*(.+?)\*\*/g;let start=0,m;
 while((m=pattern.exec(text))){parent.append(document.createTextNode(text.slice(start,m.index)));if(m[1]){const a=make('a','inline-link',m[1].replace(/ #(Topic|Note|Question|Idea|Mistake)\b/g,''));a.href='https://app.tana.inc/?nodeid='+encodeURIComponent(m[2]);a.target='_blank';a.rel='noopener';const targetId=m[2];
 if(currentView==='content'&&nodeIndex.has(targetId)){
  a.removeAttribute('target');a.dataset.nodeId=targetId;
  a.addEventListener('click',event=>{if(event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();renderNode({tanaId:targetId},true,true);});
 }
 parent.append(a);}else if(m[3]||m[4])parent.append(make('code','',m[3]||m[4]));else parent.append(make('strong','',m[5]));start=pattern.lastIndex;}
 parent.append(document.createTextNode(text.slice(start).replace(/<[^>]*>/g,'')));
}
function renderBody(container,body){
 const initialCount=container.children.length;let code=null,codeLines=[],rootSkipped=false;const lines=(body||'').split('\n');
 for(let line of lines){if(line.startsWith('```')){if(code){container.append(make('pre','code-block',codeLines.join('\n')));code=null;codeLines=[];}else code=true;continue;}if(code){codeLines.push(line);continue;}
 line=line.replace(/<!--.*?-->/g,'').trim();if(!line)continue;
 if(!rootSkipped){rootSkipped=true;continue;}
 if(/^[- ]*\*{0,2}(Status|Topic|Type|Parent)\*{0,2}:/.test(line))continue;
 line=line.replace(/^\s*-\s*/,'');let p=make('div','note-line');inline(p,line);container.append(p);
 }
 if(codeLines.length)container.append(make('pre','code-block',codeLines.join('\n')));
 if(container.children.length===initialCount)container.append(make('p','empty','暂时没有正文内容。'));
}
function chip(parent,text,cls=''){parent.append(make('span','badge '+cls,text));}
function section(parent,title){let el=make('section','detail-section');el.append(make('h3','section-title',title));parent.append(el);return el;}
function related(parent,label,items){if(!items.length)return;const s=section(parent,label);for(const item of items){const b=make('button','relation-card');b.append(make('span','relation-title',item.name));if(item.hint)b.append(make('small','relation-hint',item.hint));b.append(make('span','relation-arrow','↗'));b.onclick=()=>renderNode({tanaId:item.tanaId||item.id});s.append(b);}}
function renderNode(input,record=true,center=false){
 const n=currentView==='content'?nodeIndex.get(input.tanaId):null,s=currentView==='schema'?[...schemaData.tags,...schemaData.fields].find(n=>n.tanaId===input.tanaId):null;if(!n&&!s)return;
 detailPanel.classList.remove('compact');
 if(record||center)setDetailPanelOpen(true);
 if(record&&activeId&&activeId!==input.tanaId)history.push(activeId);activeId=input.tanaId;focusNode(activeId,center);
 const item=n||s,detail=document.getElementById('detail');detail.replaceChildren();document.getElementById('overview').hidden=true;detail.hidden=false;
 const top=make('div','detail-top');top.append(make('span','eyebrow',n?'笔记详情':'结构详情'));const back=make('button','back-button','图谱概览');back.onclick=overview;const prev=make('button','back-button','← 返回');prev.id='detail-back';prev.disabled=!history.length;prev.onclick=()=>renderNode({tanaId:history.pop()},false,true);top.append(prev,back);detail.append(top,make('h2','detail-title',item.name));
 const badges=make('div','badges');detail.append(badges);
 if(n){
  chip(badges,{Note:'笔记',Question:'问题',Idea:'想法',Mistake:'易错点',Topic:'主题',Book:'书籍'}[n.kind]||n.kind);
  if(n.status)chip(badges,{Answered:'已回答',Unanswered:'待解答','In progress':'进行中',Done:'已完成'}[n.status]||n.status,n.status==='Answered'?'success':'');
  const topics=graphData.edges.filter(e=>e.source===n.id&&e.type==='topic').map(e=>nodeIndex.get(e.target));for(const t of topics)chip(badges,t.name,'topic');
  if(n.keywords?.length){const block=make('div','keyword-block'),list=make('div','keyword-list');block.append(make('span','keyword-label','关键词'));for(const keyword of n.keywords)list.append(make('span','keyword-chip',keyword));block.append(list);detail.append(block);}
  const body=section(detail,'正文');renderBody(body,n.body);
  const neighbours=(graphData.semantic?.relatedNotes?.[n.id]||[]).filter(item=>nodeIndex.has(item.id));
  if(neighbours.length){related(detail,'语义相关 · '+neighbours.length,neighbours.map(item=>({...nodeIndex.get(item.id),hint:'相似度 '+item.score.toFixed(2)})));detail.append(make('p','semantic-hint','按语义相似度推荐，不代表真实引用。'));}
  else detail.append(make('p','semantic-hint',graphData.semantic?.status==='ready'&&graphData.semantic?.relatedStatus!=='unavailable'&&Object.hasOwn(graphData.semantic?.relatedNotes||{},n.id)?'暂未找到达到相似度要求的相关笔记。':'相关推荐暂不可用，请稍后再试。'));

  const hierarchy=graphData.edges.filter(e=>(e.source===n.id||e.target===n.id)&&['contains','parent'].includes(e.type)).map(e=>({...nodeIndex.get(e.source===n.id?e.target:e.source),hint:e.type==='parent'?'主题层级':'笔记层级'}));related(detail,'层级关系',hierarchy);
 }else{
  const field=schemaData.fields.some(f=>f.id===s.id);chip(badges,field?'字段':'标签');
  if(field){chip(badges,({content:'文本',instance:'节点引用',options:'选项',url:'网址',date:'日期'})[s.type]||s.type,'topic');const sec=section(detail,'字段设置');if(s.options){const opts=make('div','badges');s.options.forEach(o=>chip(opts,o));sec.append(opts);}if(s.default)sec.append(make('p','setting-row','默认值：'+s.default));if(s.description)sec.append(make('p','setting-row',s.description));related(detail,'引用目标',schemaData.instanceOf.filter(e=>e.field===s.id).map(e=>byId.get(e.tag)));related(detail,'使用此字段的标签',schemaData.hasField.filter(e=>e.field===s.id).map(e=>byId.get(e.tag)));}
  else{const desc=(s.body||'').split('\n').filter(l=>l&&!/^(#|Extends|-|  |<)/.test(l));if(desc.length){const sec=section(detail,'说明');sec.append(make('p','description',desc.join('\n')));}related(detail,'字段',schemaData.hasField.filter(e=>e.tag===s.id).map(e=>({...byId.get(e.field),hint:({content:'文本',instance:'节点引用',options:'选项',url:'网址',date:'日期'})[byId.get(e.field).type]})));related(detail,'继承自',schemaData.extends.filter(e=>e.from===s.id).map(e=>byId.get(e.to)));related(detail,'子标签',schemaData.extends.filter(e=>e.to===s.id).map(e=>byId.get(e.from)));}
 }
 const link=make('a','open-tana','在 Tana 中打开 ↗');link.href='https://app.tana.inc/?nodeid='+encodeURIComponent(item.tanaId||item.id);link.target='_blank';link.rel='noopener';detail.append(link);document.querySelector('aside').scrollTop=0;
}
function show(k){detailPanel.classList.add('compact');history=[];activeId=null;document.getElementById('node-search').value='';document.getElementById('search-results').replaceChildren();currentView=k;frame.srcdoc=views[k];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id===k));document.getElementById('detail').hidden=true;document.getElementById('overview').hidden=false;document.getElementById('summary').textContent=k==='content'?`${graphData.nodes.length} 个知识节点 · ${graphData.edges.filter(e=>e.type==='ref').length} 条正文引用`:`${schemaData.tags.length} 个标签 · ${schemaData.fields.length} 个字段`;}
document.getElementById('content').onclick=()=>show('content');document.getElementById('schema').onclick=()=>show('schema');window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.action==='dismiss')overview();else if(e.data?.node)renderNode(e.data.node);});show('content');

const search=document.getElementById('node-search'),results=document.getElementById('search-results');
function renderSearchResults(){
 results.replaceChildren();const input=search.value.trim();if(!input)return;
 const tags=[];
 const q=(currentView==='content'?input.replace(/(^|\s)#(?:"([^"]+)"|([^\s#]+))/gu,(_,space,quoted,name)=>{tags.push((quoted||name).toLocaleLowerCase());return space;}):input).trim().toLocaleLowerCase();
 const tagNames=new Map((graphData.availableTags||[]).map(tag=>[tag.id,tag.name.toLocaleLowerCase()]));
 const pool=currentView==='content'?graphData.nodes:[...schemaData.tags,...schemaData.fields];
 const hits=pool.filter(n=>tags.every(tag=>(n.tagIds||[]).some((id,index)=>id.toLocaleLowerCase()===tag||(tagNames.get(id)||n.tagNames?.[index]?.toLocaleLowerCase())===tag))&&(!q||(n.name+' '+(n.body||'')).toLocaleLowerCase().includes(q))).sort((a,b)=>Number(b.name.toLocaleLowerCase().includes(q))-Number(a.name.toLocaleLowerCase().includes(q)));
 results.append(make('p','search-count',hits.length?'找到 '+hits.length+' 个节点':'没有匹配的节点'));
 for(const n of hits){const b=make('button','search-hit',n.name);b.dataset.nodeId=n.tanaId||n.id;const kind=n.tagNames?.join(' · ')||n.kind||(schemaData.fields.includes(n)?'字段':'标签');b.append(make('small','',kind));b.onclick=()=>{renderNode({tanaId:n.tanaId||n.id},true,true);results.replaceChildren();};results.append(b);}
}
search.addEventListener('input',renderSearchResults);
search.addEventListener('keydown',e=>{if(e.key==='Enter')results.querySelector('button')?.click();if(e.key==='Escape'){search.value='';results.replaceChildren();search.blur();}});


// This bridge adds live data only; the original controls and force simulations remain intact.
if(location.protocol==='http:'||location.protocol==='https:'){
 const syncStatus=document.getElementById('live-status');
 let revision='',loading=false,queued=null,events=null,streamOpen=false,fallbackTimer=null,needsSnapshot=false,lastEvent=null,requestController=null;
 window.pendingLiveScene=null;
 const signatures={content:JSON.stringify(graphData),schema:JSON.stringify(schemaData)};
 function detailSignature(){
  if(!activeId)return null;
  if(currentView==='schema')return JSON.stringify(schemaData);
  const n=nodeIndex.get(activeId);if(!n)return null;
  const {x,y,...detail}=n;
  const edges=graphData.edges.filter(e=>e.source===activeId||e.target===activeId);
  const neighbours=graphData.semantic?.relatedNotes?.[activeId]||[];
  return JSON.stringify([graphData.semantic?.status,graphData.semantic?.relatedStatus,!!graphData.semantic?.relatedNotes&&Object.hasOwn(graphData.semantic.relatedNotes,activeId),detail,edges,edges.map(e=>{const other=nodeIndex.get(e.source===activeId?e.target:e.source);return other&&[other.id,other.name];}),neighbours,neighbours.map(item=>[item.id,nodeIndex.get(item.id)?.name])]);
 }
 function applyLive(payload){
  // Snapshot fetches are sequential: each response supersedes the queued snapshot.
  // Even a return to the displayed revision must discard an older queued change.
  if(payload.revision===revision){queued=null;return;}
  if(frame.contentWindow.liveBusy){queued=payload;return;}
  queued=null;
  const previousDetail=detailSignature(),aside=document.querySelector('aside'),scroll=detailReadingScroll();
  const next={content:JSON.stringify(payload.graph),schema:JSON.stringify(payload.schema)};
  const changed=next[currentView]!==signatures[currentView];
  views=payload.views;graphData=payload.graph;schemaData=payload.schema;
  nodeIndex.clear();graphData.nodes.forEach(n=>nodeIndex.set(n.id,n));byId.clear();[...schemaData.tags,...schemaData.fields].forEach(n=>byId.set(n.id,n));
  if(changed){window.pendingLiveScene=frame.contentWindow.captureLiveScene?.()||null;frame.srcdoc=views[currentView];}
  signatures.content=next.content;signatures.schema=next.schema;revision=payload.revision;
  document.querySelector('header > div > small').textContent=payload.workspace+' · 笔记与关联';
  document.getElementById('summary').textContent=currentView==='content'?`${graphData.nodes.length} 个知识节点 · ${graphData.edges.filter(e=>e.type==='ref').length} 条正文引用`:`${schemaData.tags.length} 个标签 · ${schemaData.fields.length} 个字段`;
  if(activeId){const exists=currentView==='content'?nodeIndex.has(activeId):[...schemaData.tags,...schemaData.fields].some(n=>n.tanaId===activeId);if(exists){if(previousDetail!==detailSignature()){renderNode({tanaId:activeId},false);restoreDetailReadingScroll(scroll);}}else overview();}
  renderSearchResults();
 }
 frame.addEventListener('load',()=>{window.pendingLiveScene=null;if(activeId)focusNode(activeId);});
 // A normal tab switch must not inherit the other view's scene.
 const originalShow=show;show=function(k){window.pendingLiveScene=null;originalShow(k);};
 function acceptMetadata(metadata){
  if(lastEvent&&metadata.version<lastEvent.version)return;
  lastEvent=metadata;setLiveStatus(metadata.syncState,metadata.observedAt);
  if(metadata.revision===revision)queued=null;
  else if(metadata.ready&&metadata.revision!==queued?.revision)fetchSnapshot();
 }
 async function fetchSnapshot(){
  if(loading){needsSnapshot=true;return;}loading=true;needsSnapshot=false;
  requestController=new AbortController();const timeout=setTimeout(()=>requestController?.abort(),120000);
  try{
   const response=await fetch('/api/data',{cache:'no-store',signal:requestController.signal});if(!response.ok)throw Error('sync');const payload=await response.json();
   if(lastEvent&&Number.isFinite(payload.eventVersion)&&payload.eventVersion<lastEvent.version&&payload.revision!==lastEvent.revision){needsSnapshot=true;return;}
   applyLive(payload);
   const metadata=lastEvent&&Number.isFinite(payload.eventVersion)&&lastEvent.version>payload.eventVersion?lastEvent:payload;
   setLiveStatus(metadata.syncState||(metadata.stale?'offline':'ready'),metadata.observedAt);
  }catch(error){setLiveStatus('offline');}
  finally{
   clearTimeout(timeout);requestController=null;loading=false;
   if(needsSnapshot){needsSnapshot=false;fetchSnapshot();}
  }
 }
 function scheduleFallback(){
  if(fallbackTimer!==null)return;
  fallbackTimer=setTimeout(async()=>{fallbackTimer=null;await fetchSnapshot();if(!streamOpen)scheduleFallback();},5000);
 }
 function connectUpdates(){
  if(!window.EventSource){fetchSnapshot();scheduleFallback();return;}
  events=new EventSource('/api/events');
  events.onopen=()=>{streamOpen=true;lastEvent=null;if(fallbackTimer!==null){clearTimeout(fallbackTimer);fallbackTimer=null;}};
  events.addEventListener('snapshot',event=>{try{acceptMetadata(JSON.parse(event.data));}catch(error){setLiveStatus('offline');scheduleFallback();}});
  events.onerror=()=>{streamOpen=false;setLiveStatus('offline');scheduleFallback();};
 }
 setInterval(()=>{if(queued&&!frame.contentWindow.liveBusy){const pending=queued;queued=null;applyLive(pending);}},250);
 window.addEventListener('pagehide',()=>{events?.close();streamOpen=false;clearTimeout(fallbackTimer);fallbackTimer=null;requestController?.abort();});
 window.addEventListener('pageshow',event=>{if(event.persisted)connectUpdates();});
 connectUpdates();
}


// A persistent toolbar follows the active iframe's actual SVG scale.
const zoomInput=document.getElementById('zoom-percent'),zoomOut=document.getElementById('zoom-out'),zoomIn=document.getElementById('zoom-in');
let zoomEditing=false;
function refreshZoomControls(){
 const percent=frame.contentWindow?.readGraphZoom?.();if(!Number.isFinite(percent))return;
 if(!zoomEditing)zoomInput.value=String(Math.round(percent))+'%';
 zoomOut.disabled=percent<=10.001;zoomIn.disabled=percent>=399.999;
}
function changeGraphZoom(percent){frame.contentWindow?.setGraphZoom?.(percent);refreshZoomControls();}
function commitZoomInput(){
 if(!zoomEditing){refreshZoomControls();return;}
 const value=zoomInput.value.trim().replace(/%$/,'').trim();zoomEditing=false;
 if(/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(value))changeGraphZoom(Number(value));
 else refreshZoomControls();
}
zoomInput.addEventListener('input',()=>zoomEditing=true);
zoomInput.addEventListener('blur',commitZoomInput);
zoomInput.addEventListener('keydown',event=>{
 if(event.key==='Enter'){event.preventDefault();commitZoomInput();zoomInput.blur();}
 if(event.key==='Escape'){event.preventDefault();zoomEditing=false;refreshZoomControls();zoomInput.blur();}
});
zoomOut.onclick=()=>changeGraphZoom((frame.contentWindow?.readGraphZoom?.()||100)/1.12);
zoomIn.onclick=()=>changeGraphZoom((frame.contentWindow?.readGraphZoom?.()||100)*1.12);
window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.action==='zoom-state')refreshZoomControls();});
frame.addEventListener('load',refreshZoomControls);

const uiMotion=document.getElementById('ui-motion'),uiIsolated=document.getElementById('ui-isolated');
function refreshGraphActions(){
 const state=frame.contentWindow?.readGraphControls?.();if(!state)return;
 document.getElementById('isolation-control').hidden=currentView!=='content';document.getElementById('view-options').hidden=currentView!=='content';
 if(state.isolated!==null)uiIsolated.checked=state.isolated;
 uiMotion.querySelector('span').textContent=state.running?'暂停':'继续';uiMotion.setAttribute('aria-label',state.running?'暂停动态':'恢复动态');
 uiMotion.querySelector('svg').innerHTML=state.running?'<path d="M8 5v14M16 5v14"/>':'<path d="m8 5 11 7-11 7Z"/>';
 document.getElementById('layout-status').textContent=state.running?'布局运行中':'布局已暂停';
 for(const input of document.querySelectorAll('[data-ui-edge]'))input.checked=state.edges[input.dataset.uiEdge]??true;
}
function graphAction(action,value){frame.contentWindow?.runGraphAction?.(action,value);refreshGraphActions();}
uiIsolated.addEventListener('change',()=>graphAction('isolated',uiIsolated.checked));
uiMotion.onclick=()=>graphAction('motion');document.getElementById('ui-pdf').onclick=()=>graphAction('pdf');document.getElementById('ui-fit').onclick=()=>graphAction('fit');document.getElementById('ui-reset').onclick=()=>graphAction('reset');
for(const input of document.querySelectorAll('[data-ui-edge]'))input.addEventListener('change',()=>graphAction('edge:'+input.dataset.uiEdge,input.checked));
window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.action==='controls-state')refreshGraphActions();});
frame.addEventListener('load',refreshGraphActions);
</script></html>
